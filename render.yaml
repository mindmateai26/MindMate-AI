services:
  - type: web
    name: mindmate-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
